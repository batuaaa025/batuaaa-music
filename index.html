<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Batuaaa ❤️</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
}

body{
    background:#030207;
}

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(circle at 20% 35%,
        rgba(255,0,120,.20),transparent 28%),

        radial-gradient(circle at 80% 20%,
        rgba(130,0,255,.20),transparent 30%),

        linear-gradient(
        145deg,
        #020105,
        #100411 38%,
        #190615 65%,
        #030207
        );
}

.light{
    position:absolute;
    width:55vw;
    height:55vw;
    border-radius:50%;
    filter:blur(90px);
    opacity:.25;
}

.light.one{
    background:#ff006f;
    left:-25%;
    top:20%;
    animation:moveOne 12s ease-in-out infinite alternate;
}

.light.two{
    background:#7b00ff;
    right:-25%;
    top:5%;
    animation:moveTwo 15s ease-in-out infinite alternate;
}

@keyframes moveOne{
    from{transform:translate(0,0)}
    to{transform:translate(70px,-40px)}
}

@keyframes moveTwo{
    from{transform:translate(0,0)}
    to{transform:translate(-60px,50px)}
}

.moon{
    position:absolute;
    width:78px;
    height:78px;
    top:10%;
    right:12%;
    border-radius:50%;

    background:
    radial-gradient(
        circle at 35% 30%,
        #fff,
        #ffd0e5 35%,
        #ff4f9c 72%,
        #8d1458
    );

    box-shadow:
    0 0 30px rgba(255,60,160,.8),
    0 0 90px rgba(255,0,130,.35);

    animation:moon 6s ease-in-out infinite;
}

@keyframes moon{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ffd1e7;
    box-shadow:0 0 8px #ff55a5;
    animation:star 3s ease-in-out infinite;
}

.st1{left:7%;top:17%;animation-delay:.2s}
.st2{left:18%;top:10%;animation-delay:1s}
.st3{left:29%;top:25%;animation-delay:1.8s}
.st4{left:42%;top:13%;animation-delay:.7s}
.st5{left:54%;top:22%;animation-delay:2.2s}
.st6{left:65%;top:8%;animation-delay:1.3s}
.st7{left:76%;top:29%;animation-delay:.4s}
.st8{left:89%;top:17%;animation-delay:2s}
.st9{left:34%;top:34%;animation-delay:1.5s}
.st10{left:57%;top:34%;animation-delay:.9s}

@keyframes star{
    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }
    50%{
        opacity:1;
        transform:scale(2);
    }
}

.rain{
    position:absolute;
    top:-80px;
    width:1px;
    height:70px;

    background:
    linear-gradient(
        transparent,
        rgba(255,105,180,.5)
    );

    animation:rain linear infinite;
}

.r1{left:5%;animation-duration:4s}
.r2{left:14%;animation-duration:3s}
.r3{left:24%;animation-duration:4.5s}
.r4{left:34%;animation-duration:3.5s}
.r5{left:44%;animation-duration:4.2s}
.r6{left:54%;animation-duration:3.2s}
.r7{left:64%;animation-duration:4.6s}
.r8{left:74%;animation-duration:3.8s}
.r9{left:84%;animation-duration:4.1s}
.r10{left:94%;animation-duration:3.4s}

@keyframes rain{
    from{
        transform:translateY(-100px);
        opacity:0;
    }

    15%{opacity:.65}

    to{
        transform:translateY(115vh);
        opacity:0;
    }
}

.city{
    position:absolute;
    bottom:21%;
    left:0;
    width:100%;
    height:80px;
    opacity:.35;
}

.window{
    position:absolute;
    width:3px;
    height:5px;
    background:#ff6aa9;
    box-shadow:0 0 7px #ff287f;
    animation:window 3s ease-in-out infinite alternate;
}

.w1{left:8%;bottom:30px}
.w2{left:17%;bottom:50px;animation-delay:1s}
.w3{left:28%;bottom:22px;animation-delay:2s}
.w4{left:39%;bottom:43px;animation-delay:.5s}
.w5{left:51%;bottom:25px;animation-delay:1.5s}
.w6{left:64%;bottom:47px;animation-delay:.8s}
.w7{left:77%;bottom:27px;animation-delay:2.2s}
.w8{left:90%;bottom:52px;animation-delay:1.2s}

@keyframes window{
    from{opacity:.2}
    to{opacity:1}
}

.person{
    position:absolute;
    bottom:16%;
    width:65px;
    height:160px;
    z-index:3;
    animation:breathe 4s ease-in-out infinite alternate;
}

.person:before{
    content:"";
    position:absolute;
    width:32px;
    height:32px;
    left:16px;
    top:0;
    border-radius:50%;
    background:#010104;
}

.person:after{
    content:"";
    position:absolute;
    width:58px;
    height:112px;
    left:3px;
    top:30px;
    border-radius:30px 30px 5px 5px;
    background:#010104;
}

.boy{left:25%}

.girl{
    left:67%;
    transform:scale(.82);
    animation-delay:1s;
}

@keyframes breathe{
    from{margin-bottom:0}
    to{margin-bottom:5px}
}

.connection{
    position:absolute;
    z-index:3;
    left:31%;
    width:38%;
    bottom:24%;
    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,70,160,.35),
        transparent
    );

    animation:connection 4s ease-in-out infinite;
}

@keyframes connection{
    0%,100%{opacity:.1}
    50%{opacity:.7}
}

.ground{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-15%;
    height:37%;
    border-radius:50% 50% 0 0;

    background:
    radial-gradient(
        ellipse at center top,
        rgba(255,0,120,.10),
        transparent 55%
    ),
    linear-gradient(#09030b,#010103);

    z-index:4;
}

.vignette{
    position:fixed;
    inset:0;
    z-index:5;

    background:
    radial-gradient(
        circle,
        transparent 28%,
        rgba(0,0,0,.68)
    );

    pointer-events:none;
}

.content{
    position:relative;
    z-index:10;
    width:100%;
    min-height:100vh;

    padding:18px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
}

.top{
    width:100%;
    max-width:950px;

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.info{
    padding:8px 12px;
    border-radius:20px;

    background:rgba(0,0,0,.4);

    border:1px solid rgba(255,80,170,.2);

    backdrop-filter:blur(10px);

    font-size:12px;
}

.time{
    justify-self:start;
}

.online{
    justify-self:end;
}

.creator{
    justify-self:center;
    white-space:nowrap;

    color:#ffb5d9;

    font-size:clamp(9px,2.5vw,14px);

    font-weight:bold;

    text-shadow:
    0 0 8px #ff2080,
    0 0 18px rgba(255,0,130,.6);
}

.dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;

    background:#ff4c9a;

    box-shadow:0 0 10px #ff1680;

    margin-right:5px;
}

.memory{
    text-align:center;
    width:100%;
    max-width:700px;
    margin-top:-10px;
}

.memory-small{
    color:#ff7eb8;
    font-size:10px;
    letter-spacing:5px;
    margin-bottom:12px;
    opacity:.7;
}

.title{
    margin:0;

    font-size:clamp(38px,9vw,76px);

    font-weight:800;

    background:
    linear-gradient(
        90deg,
        #ff438f,
        #fff,
        #b85cff,
        #ff438f
    );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:title 5s linear infinite;
}

@keyframes title{
    from{background-position:0%}
    to{background-position:250%}
}

.memory-text{
    position:relative;
    min-height:42px;
    margin-top:12px;

    color:#f5c3db;

    font-size:14px;
    line-height:1.7;
}

.message{
    position:absolute;
    width:100%;
    left:0;
    opacity:0;
    animation:message 12s infinite;
}

.message:nth-child(2){
    animation-delay:4s;
}

.message:nth-child(3){
    animation-delay:8s;
}

@keyframes message{

    0%,5%{
        opacity:0;
        transform:translateY(8px);
    }

    12%,28%{
        opacity:.85;
        transform:translateY(0);
    }

    34%,100%{
        opacity:0;
        transform:translateY(-8px);
    }
}


/* PLAYER */

.player{
    width:100%;
    max-width:420px;

    padding:18px;

    margin-bottom:10px;

    border-radius:26px;

    background:
    linear-gradient(
        145deg,
        rgba(25,3,18,.78),
        rgba(3,2,7,.82)
    );

    border:1px solid rgba(255,70,160,.28);

    backdrop-filter:blur(18px);

    box-shadow:
    0 0 30px rgba(255,0,130,.12),
    0 20px 70px rgba(0,0,0,.6);

    transform:translateY(-35px);
}

.cd-area{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
}

.cd{
    width:78px;
    height:78px;
    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #09050a 0 8%,
        #ff82bd 8.5% 10%,
        #181019 10.5% 23%,
        #b64a83 23.5% 24%,
        #09070c 24.5% 37%,
        #ff9acb 37.5% 38%,
        #111 38.5% 51%,
        #8c2c65 51.5% 52%,
        #07060a 52.5% 100%
    );

    box-shadow:
    0 0 25px rgba(255,0,130,.35);

    position:relative;
}

.cd:after{
    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:#09060a;

    border:3px solid #ff73b2;
}

.cd.playing{
    animation:spin 3s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

#progress{
    width:100%;
    height:5px;

    accent-color:#ff3d91;

    cursor:pointer;

    touch-action:manipulation;
}

.times{
    display:flex;
    justify-content:space-between;

    margin-top:5px;

    font-size:10px;

    color:#ffacd1;
}

.controls{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:22px;

    margin-top:12px;
}

.control{
    width:54px;
    height:54px;

    border-radius:50%;

    color:#ffb7d9;

    background:rgba(255,30,130,.12);

    border:1px solid rgba(255,80,170,.3);

    font-size:20px;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    touch-action:manipulation;

    transition:.2s;
}

.control:active{
    transform:scale(.92);
}

.play{
    width:66px;
    height:66px;

    color:white;

    background:
    linear-gradient(
        135deg,
        #ff3b8f,
        #9e38ff
    );

    box-shadow:
    0 0 25px rgba(255,0,130,.4);

    font-size:23px;
}

@media(max-width:600px){

    .content{
        padding-top:14px;
        padding-bottom:10px;
    }

    .info{
        padding:7px 8px;
        font-size:9px;
    }

    .creator{
        font-size:8.5px;
    }

    .moon{
        width:60px;
        height:60px;
        right:9%;
        top:12%;
    }

    .boy{
        left:17%;
        transform:scale(.78);
    }

    .girl{
        left:68%;
        transform:scale(.6);
    }

    .title{
        font-size:39px;
    }

    .memory-small{
        font-size:8px;
        letter-spacing:3px;
    }

    .memory-text{
        font-size:12px;
    }

    .player{
        padding:16px;
        margin-bottom:0;
        transform:translateY(-55px);
    }

    .cd{
        width:70px;
        height:70px;
    }

    .controls{
        gap:20px;
        margin-top:10px;
    }

    .control{
        width:56px;
        height:56px;
        font-size:20px;
    }

    .play{
        width:68px;
        height:68px;
        font-size:23px;
    }

    #progress{
        height:6px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="light one"></div>
    <div class="light two"></div>

    <div class="moon"></div>

    <span class="star st1"></span>
    <span class="star st2"></span>
    <span class="star st3"></span>
    <span class="star st4"></span>
    <span class="star st5"></span>
    <span class="star st6"></span>
    <span class="star st7"></span>
    <span class="star st8"></span>
    <span class="star st9"></span>
    <span class="star st10"></span>

    <span class="rain r1"></span>
    <span class="rain r2"></span>
    <span class="rain r3"></span>
    <span class="rain r4"></span>
    <span class="rain r5"></span>
    <span class="rain r6"></span>
    <span class="rain r7"></span>
    <span class="rain r8"></span>
    <span class="rain r9"></span>
    <span class="rain r10"></span>

    <div class="city">
        <span class="window w1"></span>
        <span class="window w2"></span>
        <span class="window w3"></span>
        <span class="window w4"></span>
        <span class="window w5"></span>
        <span class="window w6"></span>
        <span class="window w7"></span>
        <span class="window w8"></span>
    </div>

    <div class="person boy"></div>
    <div class="person girl"></div>

    <div class="connection"></div>
    <div class="ground"></div>

</div>

<div class="vignette"></div>

<div class="content">

    <div class="top">

        <div class="info time">
            🕐
            <span id="liveTime">12:00 AM</span>
        </div>

        <div class="creator">
            MODE BY MOHIT • FOR BATUAAA❤️
        </div>

        <div class="info online">

            <span class="dot"></span>

            <span id="online">1</span>

            Online

        </div>

    </div>


    <div class="memory">

        <div class="memory-small">
            SOME MEMORIES NEVER FADE
        </div>

        <h1 class="title">
            Batuaaa ❤️
        </h1>

        <div class="memory-text">

            <div class="message">
                कुछ लोग दूर होकर भी,
                यादों में हमेशा पास रहते हैं...
            </div>

            <div class="message">
                कुछ पल छोटे होते हैं,
                लेकिन यादें बहुत लंबी...
            </div>

            <div class="message">
                दूरी चाहे जितनी हो,
                कुछ एहसास दिल से नहीं जाते...
            </div>

        </div>

    </div>


    <div class="player">

        <div class="cd-area">

            <div class="cd" id="cd"></div>

        </div>

        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <div class="times">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

        <div class="controls">

            <button
                class="control"
                id="prev">
                ⏮
            </button>

            <button
                class="control play"
                id="play">
                ▶
            </button>

            <button
                class="control"
                id="next">
                ⏭
            </button>

        </div>

    </div>

</div>


<audio id="audio" preload="metadata"></audio>


<script>

/* =========================
   22 SONGS
========================= */

const songs=[];

for(let i=1;i<=6;i++){

    songs.push(
        "songs/song"+i+".mp3"
    );

}

const audio=document.getElementById("audio");

const play=document.getElementById("play");

const prev=document.getElementById("prev");

const next=document.getElementById("next");

const progress=document.getElementById("progress");

const currentTime=document.getElementById("currentTime");

const duration=document.getElementById("duration");

const cd=document.getElementById("cd");

let currentSong=0;


/* =========================
   12 HOUR CLOCK
========================= */

function clock(){

    const d=new Date();

    let hours=d.getHours();

    const minutes=String(
        d.getMinutes()
    ).padStart(2,"0");

    const seconds=String(
        d.getSeconds()
    ).padStart(2,"0");

    const ampm=
        hours >= 12 ? "PM" : "AM";

    hours=hours % 12;

    if(hours===0){
        hours=12;
    }

    document.getElementById(
        "liveTime"
    ).textContent=
        hours+":"+minutes+":"+seconds+" "+ampm;
}

clock();

setInterval(clock,1000);


/* =========================
   FORMAT SONG TIME
========================= */

function formatTime(sec){

    if(!sec || isNaN(sec)){
        return "0:00";
    }

    const min=Math.floor(sec/60);

    const sec2=Math.floor(sec%60);

    return min+":"+String(sec2).padStart(2,"0");
}


/* =========================
   LOAD SONG
========================= */

function loadSong(index){

    currentSong=index;

    audio.src=songs[index];

    progress.value=0;

    currentTime.textContent="0:00";

    duration.textContent="0:00";

    audio.load();
}


/* =========================
   START PLAYING
========================= */

function startPlaying(){

    audio.play()

    .then(()=>{

        play.textContent="⏸";

        cd.classList.add("playing");

    })

    .catch(()=>{

        /* Browser autoplay blocked */

    });
}


/* =========================
   PLAY / PAUSE
========================= */

play.addEventListener(
    "click",
    ()=>{

        if(audio.paused){

            startPlaying();

        }else{

            audio.pause();

            play.textContent="▶";

            cd.classList.remove(
                "playing"
            );

        }

    }
);


/* =========================
   NEXT
========================= */

next.addEventListener(
    "click",
    ()=>{

        currentSong++;

        if(currentSong>=songs.length){
            currentSong=0;
        }

        loadSong(currentSong);

        startPlaying();

    }
);


/* =========================
   PREVIOUS
========================= */

prev.addEventListener(
    "click",
    ()=>{

        currentSong--;

        if(currentSong<0){
            currentSong=songs.length-1;
        }

        loadSong(currentSong);

        startPlaying();

    }
);


/* =========================
   SONG DURATION
========================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        duration.textContent=
            formatTime(audio.duration);

    }
);


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(audio.duration){

            progress.value=
                (audio.currentTime/
                audio.duration)*100;

        }

        currentTime.textContent=
            formatTime(audio.currentTime);

    }
);


/* =========================
   SEEK
========================= */

progress.addEventListener(
    "input",
    ()=>{

        if(audio.duration){

            audio.currentTime=
                (progress.value/100)*
                audio.duration;

        }

    }
);


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
    "ended",
    ()=>{

        currentSong++;

        if(currentSong>=songs.length){
            currentSong=0;
        }

        loadSong(currentSong);

        startPlaying();

    }
);


/* =========================
   FIRST SONG
========================= */

loadSong(0);


/* =========================
   AUTOPLAY TRY
========================= */

window.addEventListener(
    "load",
    ()=>{

        startPlaying();

    }
);

</script>

</body>
</html>
